    <script>
        feather.replace();
        
        let currentProvider = null;
        let allProviders = [];
        let currentAppointmentId = null;

        // Load providers on page load
        document.addEventListener('DOMContentLoaded', function() {
            loadProviders();
            setupEventListeners();
        });

        function setupEventListeners() {
            // Search functionality
            document.getElementById('searchInput').addEventListener('input', filterProviders);
            document.getElementById('specializationFilter').addEventListener('change', filterProviders);
            document.getElementById('typeFilter').addEventListener('change', filterProviders);
        }

        async function loadProviders() {
            try {
                console.log('🔄 Loading healthcare providers...');
                const result = await FutureHealthAPI.getDoctors();
                
                if (result.success) {
                    allProviders = result.doctors;
                    console.log('✅ Providers loaded:', allProviders.length);
                    displayProviders(allProviders);
                } else {
                    throw new Error(result.message || 'Failed to load providers');
                }
            } catch (error) {
                console.error('❌ Error loading providers:', error);
                document.getElementById('providersGrid').innerHTML = `
                    <div class="col-span-full text-center py-12">
                        <i data-feather="alert-triangle" class="w-16 h-16 text-red-400 mx-auto mb-4"></i>
                        <h3 class="text-xl font-semibold text-gray-700 mb-2">Failed to load providers</h3>
                        <p class="text-gray-600">Please try again later</p>
                        <button onclick="loadProviders()" class="mt-4 bg-primary-500 text-white px-6 py-2 rounded-lg hover:bg-primary-600">
                            Retry
                        </button>
                    </div>
                `;
                feather.replace();
            }
        }

        function displayProviders(providers) {
            const grid = document.getElementById('providersGrid');
            const noResults = document.getElementById('noResults');

            if (providers.length === 0) {
                grid.classList.add('hidden');
                noResults.classList.remove('hidden');
                return;
            }

            noResults.classList.add('hidden');
            grid.classList.remove('hidden');

            grid.innerHTML = providers.map(provider => `
                <div class="bg-white rounded-xl shadow-md hover:shadow-lg transition duration-300 overflow-hidden">
                    <div class="p-6">
                        <!-- Provider Header -->
                        <div class="flex items-start justify-between mb-4">
                            <div class="flex items-center space-x-4">
                                <div class="w-16 h-16 rounded-full bg-${provider.userType === 'intern' ? 'purple' : 'blue'}-100 flex items-center justify-center overflow-hidden">
                                    ${provider.profileImage ? 
                                        `<img src="${provider.profileImage}" alt="${provider.name}" class="w-16 h-16 rounded-full object-cover">` :
                                        `<span class="text-${provider.userType === 'intern' ? 'purple' : 'blue'}-600 font-semibold text-lg">
                                            ${provider.name.split(' ').map(n => n[0]).join('')}
                                        </span>`
                                    }
                                </div>
                                <div>
                                    <h3 class="font-semibold text-lg text-gray-800">
                                        ${provider.userType === 'intern' ? '' : 'Dr. '}${provider.name}
                                    </h3>
                                    <p class="text-gray-600">${provider.specialization || 'General Medicine'}</p>
                                    <span class="inline-block mt-1 px-2 py-1 text-xs rounded-full ${provider.userType === 'intern' ? 'bg-purple-100 text-purple-800' : 'bg-blue-100 text-blue-800'}">
                                        ${provider.userType === 'intern' ? 'Medical Intern' : 'Licensed Doctor'}
                                    </span>
                                </div>
                            </div>
                        </div>

                        <!-- Provider Info -->
                        <div class="space-y-2 mb-4">
                            ${provider.bio ? `<p class="text-gray-600 text-sm">${provider.bio}</p>` : ''}
                            
                            <div class="flex items-center justify-between text-sm">
                                <span class="text-gray-500">Experience:</span>
                                <span class="font-medium">${provider.experience ? provider.experience + ' years' : 'Not specified'}</span>
                            </div>
                            
                            ${provider.rating ? `
                                <div class="flex items-center justify-between text-sm">
                                    <span class="text-gray-500">Rating:</span>
                                    <span class="font-medium text-yellow-600">⭐ ${provider.rating}</span>
                                </div>
                            ` : ''}
                        </div>

                        <!-- Fee and Action -->
                        <div class="flex items-center justify-between pt-4 border-t border-gray-200">
                            <div>
                                <span class="text-2xl font-bold text-gray-800">₦${provider.consultationFee || '1500'}</span>
                                <span class="text-gray-500 text-sm block">consultation</span>
                            </div>
                            <button onclick="openBookingModal('${provider._id}')" 
                                    class="bg-primary-500 hover:bg-primary-600 text-white px-6 py-2 rounded-lg transition duration-300 font-semibold">
                                Book Now
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');

            feather.replace();
        }

        function filterProviders() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const specialization = document.getElementById('specializationFilter').value;
            const typeFilter = document.getElementById('typeFilter').value;

            const filtered = allProviders.filter(provider => {
                const matchesSearch = !searchTerm || 
                    provider.name.toLowerCase().includes(searchTerm) ||
                    (provider.specialization && provider.specialization.toLowerCase().includes(searchTerm)) ||
                    (provider.bio && provider.bio.toLowerCase().includes(searchTerm));

                const matchesSpecialization = !specialization || 
                    (provider.specialization === specialization);

                const matchesType = !typeFilter || 
                    provider.userType === typeFilter;

                return matchesSearch && matchesSpecialization && matchesType;
            });

            displayProviders(filtered);
        }

        function openBookingModal(providerId) {
            currentProvider = allProviders.find(p => p._id === providerId);
            
            if (!currentProvider) {
                alert('Provider not found');
                return;
            }

            // Update provider info in modal
            document.getElementById('providerInfo').innerHTML = `
                <div class="flex items-center space-x-4">
                    <div class="w-12 h-12 rounded-full bg-${currentProvider.userType === 'intern' ? 'purple' : 'blue'}-100 flex items-center justify-center overflow-hidden">
                        ${currentProvider.profileImage ? 
                            `<img src="${currentProvider.profileImage}" alt="${currentProvider.name}" class="w-12 h-12 rounded-full object-cover">` :
                            `<span class="text-${currentProvider.userType === 'intern' ? 'purple' : 'blue'}-600 font-semibold">
                                ${currentProvider.name.split(' ').map(n => n[0]).join('')}
                            </span>`
                        }
                    </div>
                    <div>
                        <h4 class="font-semibold text-gray-800">
                            ${currentProvider.userType === 'intern' ? '' : 'Dr. '}${currentProvider.name}
                        </h4>
                        <p class="text-gray-600 text-sm">${currentProvider.specialization || 'General Medicine'}</p>
                        <p class="text-gray-500 text-sm">${currentProvider.userType === 'intern' ? 'Medical Intern' : 'Licensed Doctor'}</p>
                    </div>
                </div>
            `;

            // Update fee display
            const fee = currentProvider.consultationFee || (currentProvider.userType === 'intern' ? 1500 : 5000);
            const platformFee = fee * 0.03; // 3% commission
            const totalAmount = fee;
            
            document.getElementById('consultationFee').textContent = fee.toLocaleString();
            document.getElementById('platformFee').textContent = platformFee.toLocaleString();
            document.getElementById('totalAmount').textContent = totalAmount.toLocaleString();
            document.getElementById('feeAmount').textContent = totalAmount.toLocaleString();

            // Show modal
            document.getElementById('appointmentModal').classList.remove('hidden');
            feather.replace();
        }

        function closeModal() {
            document.getElementById('appointmentModal').classList.add('hidden');
            currentProvider = null;
            currentAppointmentId = null;
        }

        // Handle form submission
        document.getElementById('appointmentForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const submitButton = this.querySelector('button[type="submit"]');
            const originalText = submitButton.innerHTML;
            
            try {
                submitButton.innerHTML = '<div class="animate-spin rounded-full h-5 w-5 border-b-2 border-white mx-auto"></div>';
                submitButton.disabled = true;

                // Create appointment first
                const appointmentData = {
                    doctorId: currentProvider._id,
                    date: document.getElementById('appointmentDate').value,
                    timeSlot: {
                        start: document.getElementById('appointmentTime').value,
                        end: '16:00'
                    },
                    reason: document.getElementById('appointmentReason').value,
                    type: document.getElementById('appointmentType').value,
                    consultationFee: currentProvider.consultationFee || (currentProvider.userType === 'intern' ? 1500 : 5000)
                };

                console.log('📤 Creating appointment:', appointmentData);
                
                const appointmentResult = await FutureHealthAPI.createAppointment(appointmentData);
                
                if (!appointmentResult.success) {
                    throw new Error(appointmentResult.message || 'Failed to create appointment');
                }

                currentAppointmentId = appointmentResult.appointment._id;
                console.log('✅ Appointment created:', currentAppointmentId);

                // Initialize Paystack payment
                const user = JSON.parse(localStorage.getItem('user') || '{}');
                const fee = appointmentData.consultationFee;
                
                // ✅ FIXED: Use correct endpoint for payment initialization
                const paymentResult = await FutureHealthAPI.request('/payments/initialize', 'POST', {
                    appointmentId: currentAppointmentId,
                    email: user.email,
                    amount: fee
                });

                if (!paymentResult.success) {
                    throw new Error(paymentResult.message || 'Payment initialization failed');
                }

                console.log('✅ Payment initialized:', paymentResult);

                // Open Paystack payment
                const handler = PaystackPop.setup({
                    key: 'pk_test_your_public_key_here', // Replace with your Paystack public key
                    email: user.email,
                    amount: fee * 100, // Convert to kobo
                    ref: paymentResult.reference || 'FH-' + Date.now(),
                    onClose: function(){
                        alert('Payment cancelled. Appointment not confirmed.');
                        closeModal();
                    },
                    callback: function(response){
                        // Verify payment on backend
                        verifyPayment(response.reference);
                    }
                });
                
                handler.openIframe();

            } catch (error) {
                console.error('❌ Booking error:', error);
                alert('Error: ' + error.message);
            } finally {
                submitButton.innerHTML = originalText;
                submitButton.disabled = false;
            }
        });

        async function verifyPayment(reference) {
            try {
                console.log('🔍 Verifying payment:', reference);
                
                const result = await FutureHealthAPI.request(`/payments/verify/${reference}`, 'GET');
                
                if (result.success) {
                    alert('🎉 Payment successful! Appointment confirmed.');
                    closeModal();
                    window.location.href = '/dashboard.html';
                } else {
                    alert('Payment verification failed: ' + result.message);
                }
            } catch (error) {
                console.error('❌ Verification error:', error);
                alert('Error verifying payment. Please contact support.');
            }
        }

        // Close modal when clicking outside
        document.getElementById('appointmentModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeModal();
            }
        });
    </script>
