<!DOCTYPE html>

    <script src="https://unpkg.com/feather-icons"></script>
    
    <style>
        /* Watermark */
        .watermark {
            position: fixed;
            bottom: 20px;
            right: 20px;
            opacity: 0.1;
            z-index: -1;
            pointer-events: none;
        }
        
        .watermark img {
            width: 150px;
            height: auto;
        }
        
        /* Loading overlay */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.95);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            z-index: 9999;
        }
        
        .loading-logo {
            width: 100px;
            height: 100px;
            animation: pulse 1.5s infinite;
            margin-bottom: 20px;
        }
        
        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.1); opacity: 0.8; }
            100% { transform: scale(1); opacity: 1; }
        }
        
        /* Button visibility fixes */
        button, .btn {
            background-color: #3B82F6 !important;
            color: white !important;
            font-weight: bold !important;
        }
        
        a.btn {
            background-color: #3B82F6 !important;
            color: white !important;
        }
    </style>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#3B82F6',
                        secondary: '#10B981',
                        intern: '#8B5CF6'
                    }
                }
            }
        }
    </script>
</head>

    <script>
        feather.replace();
        
        // Hide loading overlay after 2 seconds
        setTimeout(() => {
            document.getElementById('loadingOverlay').style.display = 'none';
        }, 2000);
        
        // Check authentication
        const token = localStorage.getItem('token');
        const user = JSON.parse(localStorage.getItem('user') || '{}');
        
        if (!token || !user.id) {
            window.location.href = '/login.html';
        }
        
        // Load dashboard based on user type
        async function loadDashboard() {
            try {
                const result = await FutureHealthAPI.request('/auth/me');
                
                if (!result.success) {
                    throw new Error('Failed to load user data');
                }
                
                const currentUser = result.user;
                
                if (currentUser.userType === 'patient') {
                    loadPatientDashboard(currentUser);
                } else if (currentUser.userType === 'doctor') {
                    loadDoctorDashboard(currentUser);
                } else if (currentUser.userType === 'intern') {
                    loadInternDashboard(currentUser);
                } else {
                    loadPatientDashboard(currentUser);
                }
                
                // Hide loading overlay once dashboard is loaded
                document.getElementById('loadingOverlay').style.display = 'none';
            } catch (error) {
                console.error('Dashboard error:', error);
                document.getElementById('loadingOverlay').style.display = 'none';
                window.location.href = '/login.html';
            }
        }

        async function loadPatientAppointments() {
            try {
                const result = await FutureHealthAPI.getMyAppointments();
                
                if (result.success) {
                    const appointments = result.appointments;
                    const upcoming = appointments.filter(a => ['pending', 'confirmed'].includes(a.status) && new Date(a.date) >= new Date()).length;
                    const completed = appointments.filter(a => a.status === 'completed').length;
                    const pending = appointments.filter(a => a.status === 'pending').length;
                    
                    document.getElementById('upcomingAppointments').textContent = upcoming;
                    document.getElementById('completedAppointments').textContent = completed;
                    document.getElementById('pendingAppointments').textContent = pending;
                    
                    const container = document.getElementById('recentAppointments');
                    if (appointments.length === 0) {
                        container.innerHTML = '<p class="text-gray-500 text-center py-4">No appointments yet</p>';
                    } else {
                        container.innerHTML = appointments.map(appointment => `
                            <div class="flex items-center justify-between p-3 bg-gray-50 rounded-lg">
                                <div>
                                    <h4 class="font-semibold">${appointment.doctor.userType === 'intern' ? '' : 'Dr. '}${appointment.doctor.name}</h4>
                                    <p class="text-sm text-gray-600">${appointment.doctor.specialization} ${appointment.doctor.userType === 'intern' ? '(Intern)' : ''}</p>
                                    <p class="text-xs text-gray-500">${new Date(appointment.date).toLocaleDateString()} • ${appointment.timeSlot?.start || '10:00 AM'}</p>
                                </div>
                                <span class="px-2 py-1 text-xs rounded-full ${
                                    appointment.status === 'confirmed' ? 'bg-green-100 text-green-800' :
                                    appointment.status === 'pending' ? 'bg-yellow-100 text-yellow-800' :
                                    appointment.status === 'completed' ? 'bg-blue-100 text-blue-800' :
                                    'bg-red-100 text-red-800'
                                }">${appointment.status}</span>
                            </div>
                        `).join('');
                    }
                }
            } catch (error) {
                console.error('Error loading appointments:', error);
            }
        }
        
        async function loadDoctorAppointments() {
            try {
                const today = new Date().toISOString().split('T')[0];
                const result = await FutureHealthAPI.request(`/doctors/appointments?status=confirmed&date=${today}`);
                
                if (result.success) {
                    const appointments = result.appointments;
                    document.getElementById('todayAppointments').textContent = appointments.length;
                    
                    const container = document.getElementById('todaySchedule');
                    if (appointments.length === 0) {
                        container.innerHTML = '<p class="text-gray-500 text-center py-4">No appointments scheduled for today</p>';
                    } else {
                        container.innerHTML = appointments.map(appointment => `
                            <div class="flex items-center justify-between p-3 bg-gray-50 rounded-lg">
                                <div>
                                    <h4 class="font-semibold">${appointment.patient.name}</h4>
                                    <p class="text-sm text-gray-600">${appointment.reason}</p>
                                    <p class="text-xs text-gray-500">${appointment.timeSlot?.start || '10:00 AM'} - ${appointment.timeSlot?.end || '11:00 AM'}</p>
                                </div>
                                <span class="px-2 py-1 text-xs rounded-full ${
                                    appointment.type === 'video' ? 'bg-purple-100 text-purple-800' :
                                    appointment.type === 'phone' ? 'bg-blue-100 text-blue-800' :
                                    'bg-green-100 text-green-800'
                                }">${appointment.type || 'consultation'}</span>
                            </div>
                        `).join('');
                    }
                }
            } catch (error) {
                console.error('Error loading doctor appointments:', error);
            }
        }

                }
            } catch (error) {

            }
        }

                        container.innerHTML = '<p class="text-gray-500 text-center py-4">No learning sessions scheduled for today</p>';
                    } else {
                        container.innerHTML = appointments.map(appointment => `
                            <div class="flex items-center justify-between p-3 bg-gray-50 rounded-lg">
                                <div>
                                    <h4 class="font-semibold">${appointment.patient.name}</h4>
                                    <p class="text-sm text-gray-600">${appointment.reason}</p>
                                    <p class="text-xs text-gray-500">${appointment.timeSlot?.start || '10:00 AM'} - ${appointment.timeSlot?.end || '11:00 AM'}</p>
                                </div>
                                <span class="px-2 py-1 text-xs rounded-full bg-intern-100 text-intern-800">Learning Session</span>
                            </div>
                        `).join('');
                    }
                }
            } catch (error) {
                console.error('Error loading intern appointments:', error);
            }
        }

        async function loadInternEarnings() {
            try {
                const result = await FutureHealthAPI.getWallet();
                if (result.success && result.wallet) {
                    const earnings = result.wallet.balance || 0;
                    document.getElementById('internEarnings').textContent = `₦${earnings.toLocaleString()}`;
                }
            } catch (error) {
                console.error('Error loading intern earnings:', error);
            }
        }
        
        // Initialize dashboard
        loadDashboard();
    </script>
</body>
</html>
